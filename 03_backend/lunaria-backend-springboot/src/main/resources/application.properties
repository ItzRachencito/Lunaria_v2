server.port=${SERVER_PORT:9090}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lunaria_database}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/v1.0}

# Server URL for generating image URLs
app.server.url=${APP_SERVER_URL:https://lunariav2-production.up.railway.app}

# AWS S3 Configuration (optional - only needed if using S3 for file uploads)
aws.access.key=${AWS_ACCESS_KEY:-}
aws.secret.key=${AWS_SECRET_KEY:-}
aws.region=${AWS_REGION:us-east-1}
aws.bucket.name=${AWS_BUCKET_NAME:}

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Secret - MUST be changed in production!
jwt.secret.key=${JWT_SECRET_KEY:lunaria_secret_key_please_change_in_production_minimum_256_bits_required}

# Brevo (Sendinblue) Email Configuration
brevo.api.key=${BREVO_API_KEY}
brevo.from.email=${BREVO_FROM_EMAIL:rachengames2020@gmail.com}
brevo.from.name=${BREVO_FROM_NAME:Lunaria}

# Frontend URL for password reset links
app.frontend.url=${APP_FRONTEND_URL:https://lunaria-bikes.vercel.app}

# OTP Configuration
otp.expiration.minutes=${OTP_EXPIRATION_MINUTES:10}
